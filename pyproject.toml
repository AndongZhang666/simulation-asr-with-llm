[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-llm-ec"
version = "0.1.0"
description = "Reproducible ASR error correction with N-best language-model inputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ASR-LLM-EC reproduction contributors" }]
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
asr-ec = "asr_ec.cli:main"

[project.optional-dependencies]
asr = ["openai-whisper==20250625"]
dev = [
	"jsonschema>=4,<5",
	"mypy>=1.15,<2",
	"pytest>=9,<10",
	"ruff>=0.11,<1",
	"types-PyYAML>=6.0.12,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires local public model and audio artifacts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
